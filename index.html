  <script>
    /* Door intro: keep the page behind the shopfront colour until intro.js draws the door (3 s at most). */
    /* Set window.COOKE_INTRO_OFF = true here to skip the intro while editing the page. */
    (function () {
      if (window.COOKE_INTRO_OFF || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var d = document.documentElement;
      d.classList.add("intro-pending");
      setTimeout(function () { d.classList.remove("intro-pending"); }, 3000);
    })();
  </script>

<body data-theme="ink">
  <script>
    /* Night mode before the page draws, so a light system setting gets no dark flash (main.js keeps it in sync). */
    (function () {
      var c = null;
      try { c = localStorage.getItem("cooke-night"); } catch (e) {}
      var night = c ? c === "on" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.body.dataset.theme = night ? "ink" : "cream";
    })();
  </script>
